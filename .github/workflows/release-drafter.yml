name: Release Drafter

on:
  push:
    branches:
      - main
      - 'release/v*'
  release:
    types: [published]

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-release-draft:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version bump strategy
        run: |
          bump=${{ startsWith(github.ref_name, 'release/') && 'patch' || 'minor' }}
          sed "s/semver-increment: minor/semver-increment: $bump/" .github/release-drafter.yml > release-drafter-resolved.yml

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: file:/release-drafter-resolved.yml
          commitish: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}