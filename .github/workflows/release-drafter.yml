name: Release Drafter

on:
  workflow_dispatch: # disabled: replaced by release-cliff.yml for testing git-cliff
  # push:
  #   branches:
  #     - main
  #     - 'release/v*'
permissions:
  contents: read

env:
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update-release-draft:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute next version and baseline tag
        id: version
        run: |
          git fetch --tags

          if [[ "${{ github.ref_name }}" == release/* ]]; then
            minor_prefix="${{ github.ref_name }}"
            minor_prefix="${minor_prefix#release/}"
            latest=$(git tag --list "${minor_prefix}.*" | sort -V | tail -1)
            latest="${latest:-${minor_prefix}.0}"
            patch=$(echo "$latest" | cut -d. -f3)
            echo "version=v${minor_prefix#v}.$((patch + 1))" >> "$GITHUB_OUTPUT"
            echo "start_tag=$latest" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.0$' | sort -V | tail -1)
            latest="${latest:-v0.0.0}"
            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            echo "version=v${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
            echo "start_tag=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing draft targeting this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/releases \
            | jq -r --arg b "${{ github.ref_name }}" \
                '.[] | select(.draft == true and .target_commitish == $b) | .tag_name' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true

      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          START_TAG: ${{ steps.version.outputs.start_tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          major=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f2)

          # Generate changelog body via API; omit previous_tag_name if tag doesn't exist yet
          notes_args=(-f tag_name="$VERSION" -f target_commitish="$BRANCH")
          if git rev-parse "$START_TAG" >/dev/null 2>&1; then
            notes_args+=(-f "previous_tag_name=$START_TAG")
          fi
          notes=$(gh api /repos/${{ github.repository }}/releases/generate-notes \
            "${notes_args[@]}" \
            --jq '.body')

          # Build body via printf to avoid YAML block scalar indentation issues
          intro="We are happy to release KEDA ${VERSION#v} 🎉"
          comment="<!-- Edit this section before publishing: highlight notable features, upgrade notes, links to docs, next release date, etc. -->"
          docs="Learn how to deploy KEDA by reading [our documentation](https://keda.sh/docs/${major}.${minor}/deploy/)."
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' "$intro" "$comment" "$docs" "$notes")

          gh release create "$VERSION" \
            --draft \
            --target "$BRANCH" \
            --title "$VERSION" \
            --notes "$body"
