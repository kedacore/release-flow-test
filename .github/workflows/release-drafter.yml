name: Release Drafter

on:
  push:
    branches:
      - main
      - 'release/v*'
  release:
    types: [published]

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-release-draft:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute next version and bump strategy
        id: strategy
        run: |
          git fetch --tags

          if [[ "${{ github.ref_name }}" == release/* ]]; then
            bump=patch
            minor_prefix="${{ github.ref_name }}"
            minor_prefix="${minor_prefix#release/}"         # e.g. v2.0
            latest=$(git tag --list "${minor_prefix}.*" | sort -V | tail -1)
            latest="${latest:-${minor_prefix}.0}"
            patch=$(echo "$latest" | cut -d. -f3)
            echo "version=${minor_prefix#v}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          else
            bump=minor
            # Only vX.Y.0 tags to ignore patch releases from release branches
            latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.0$' | sort -V | tail -1)
            latest="${latest:-v0.0.0}"
            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            echo "version=${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.strategy.outputs.version }}
          commitish: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}