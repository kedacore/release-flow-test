name: Release Drafter

on:
  push:
    branches:
      - main
      - 'release/v*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-release-draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-slim
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          # Detecta automáticamente si está en 'main' o en 'release/v2.20' 
          # y aísla los cambios de esa rama específica.
          commitish: ${{ github.ref_name }}
          filter-by-commitish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}