name: "Lint PR"

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions: {}

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

# PR updates can happen in quick succession leading to this
# workflow being trigger a number of times. This limits it
# to one run per PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    name: Validate PR Metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check PR title format
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = context.payload.pull_request.title || '';

            // KEDA changelog style: **Component**: Description
            const titleMatch = title.match(/^\*\*([^*]+)\*\*:\s+(.+)$/);

            if (!titleMatch) {
              core.setFailed(
                "PR title must follow KEDA format: **Component**: Description (example: **General**: Fix nil pointer dereference)."
              );
              return;
            }

            const component = titleMatch[1].trim();
            const componentPattern = /^[A-Z][A-Za-z0-9\/,&+ .-]*$/;

            if (!componentPattern.test(component)) {
              core.setFailed(
                `PR title component '${component}' is invalid. Use a KEDA-style component such as 'General', 'Kafka Scaler', 'CI', or 'ScaledObject/ScaledJob'.`
              );
            }

      - name: Check changelog label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const VALID_LABELS = new Set([
              'kind/feature', 'kind/new-scaler',
              'kind/improvement', 'kind/enhancement',
              'kind/bug',
              'kind/deprecation',
              'kind/breaking-change',
              'kind/chore', 'kind/documentation', 'kind/dependencies', 'kind/ci',
              'skip-changelog',
            ]);

            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (labels.includes('skip-changelog')) return;

            const kindLabels = labels.filter(l => l.startsWith('kind/'));
            const invalidLabels = kindLabels.filter(l => !VALID_LABELS.has(l));

            if (kindLabels.length === 0) {
              core.setFailed(
                `PR must have exactly one valid changelog label. Valid labels: ${[...VALID_LABELS].join(', ')}`
              );
            } else if (invalidLabels.length > 0) {
              core.setFailed(
                `Unknown label(s): ${invalidLabels.join(', ')}. Valid labels: ${[...VALID_LABELS].filter(l => l !== 'skip-changelog').join(', ')}`
              );
            } else if (kindLabels.length > 1) {
              core.setFailed(
                `PR has ${kindLabels.length} kind/ labels (${kindLabels.join(', ')}). Use exactly one.`
              );
            }