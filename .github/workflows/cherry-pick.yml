name: Cherry Pick

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

jobs:
  cherry-pick:
    name: Cherry Pick
    # Only run on PR comments (not issue comments) that start with /cherry-pick
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cherry-pick ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_CHERRY_PICK_BOT_ID }}
          private-key: ${{ secrets.GH_CHERRY_PICK_BOT_PRIVATE_KEY }}

      - name: Verify commenter has write access
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`@${context.actor} does not have write access to this repository.`);
            }

      - name: Parse target branch
        id: parse
        run: |
          target=$(echo "${{ github.event.comment.body }}" | sed 's|/cherry-pick[[:space:]]*||' | tr -d '[:space:]')
          if [[ -z "$target" ]]; then
            echo "::error::No target branch specified. Usage: /cherry-pick release/vX"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Get merge commit SHA
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pr.data.merged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot cherry-pick: PR is not merged yet.',
              });
              core.setFailed('PR is not merged');
            }
            return pr.data.merge_commit_sha;

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Cherry-pick commit onto target branch
        id: cp
        env:
          TARGET: ${{ steps.parse.outputs.target }}
          COMMIT: ${{ steps.pr.outputs.result }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="cherry-pick-${PR_NUMBER}-to-${TARGET//\//-}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git fetch origin "$TARGET"
          git checkout -b "$branch" "origin/$TARGET"

          if git cherry-pick -x "$COMMIT"; then
            git push origin "$branch"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR or report failure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TARGET: ${{ steps.parse.outputs.target }}
          BRANCH: ${{ steps.cp.outputs.branch }}
          SUCCESS: ${{ steps.cp.outputs.success }}
          COMMIT: ${{ steps.pr.outputs.result }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const target = process.env.TARGET;
            const success = process.env.SUCCESS === 'true';
            const branch = process.env.BRANCH;
            const commit = process.env.COMMIT;
            const prNumber = parseInt(process.env.PR_NUMBER);

            if (!success) {
              const manualSteps = [
                '```bash',
                `git fetch origin ${target}`,
                `git checkout -b ${branch} origin/${target}`,
                `git cherry-pick -x ${commit}`,
                '# resolve conflicts, then:',
                `git push origin ${branch}`,
                '```',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ Cherry-pick to \`${target}\` failed due to conflicts. Manual steps:\n\n${manualSteps}`,
              });
              core.setFailed('Cherry-pick had conflicts');
              return;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[cherry-pick #${prNumber}] to ${target}`,
              head: branch,
              base: target,
              body: `Cherry-pick of #${prNumber} to \`${target}\`.\n\nRequested by @${context.actor} via \`/cherry-pick\` command.`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ Cherry-pick PR created: #${pr.data.number}`,
            });
