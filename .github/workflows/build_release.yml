name: Publish official image to GitHub Container Registry

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

# PR updates can happen in quick succession leading to this
# workflow being trigger a number of times. This limits it
# to one run per PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release branch for minor .0
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version"

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}"
            exit 1
          fi

          branch="release/v${major}.${minor}"

          if [[ "$patch" != "0" ]]; then
            echo "Skipping branch creation for non-minor tag ${GITHUB_REF_NAME}."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists."
            exit 0
          fi

          git push origin "${GITHUB_SHA}:refs/heads/${branch}"
          echo "Created branch ${branch} from ${GITHUB_SHA}."

          label="cherry-pick/v${major}.${minor}"
          gh label create "$label" \
            --description "Backport merged pull requests to ${branch}" \
            --color "1D76DB" \
            --force
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # needed for signing images and release manifests with GitHub OIDC Token
      attestations: write # needed for SLSA Build L2 provenance attestations
      artifact-metadata: write # needed for org-level linked artifacts dashboard
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # Username used to log in to a Docker registry. If not set then no login will occur
          username: ${{ github.repository_owner }}
          # Password or personal access token used to log in to a Docker registry. If not set then no login will occur
          password: ${{ secrets.GITHUB_TOKEN }}
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ghcr.io

      - name: Publish on GitHub Container Registry
        run: make docker-publish-multiarch
        env:
          METADATA_FILE: build-metadata.json
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Parse image digest
        id: digest
        run: |
          digest="$(jq -r '."containerimage.digest"' build-metadata.json)"
          echo "image_name=$(make -s print-image-controller)" >> "$GITHUB_OUTPUT"
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.digest.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.image_digest }}
          push-to-registry: true
      
      # https://github.com/sigstore/cosign-installer
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check Cosign install!
        run: cosign version

      - name: Sign KEDA images published on GitHub Container Registry
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: make sign-images
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
