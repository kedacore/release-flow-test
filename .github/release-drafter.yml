# .github/release-drafter.yml
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
sort-by: "title"

# PR title convention: "**ComponentName**: Brief description"
# e.g. "**General**: Fix nil pointer dereference in fallback"
#      "**Kafka Scaler**: Add support for SASL/OAuth bearer authentication"
# This makes $TITLE render identically to KEDA's CHANGELOG.md format.

change-template: "- $TITLE ([#$NUMBER]($URL))"
change-title-escapes: '\<&'

template: |
  We are happy to release KEDA $RESOLVED_VERSION 🎉

  <!-- Edit this section before publishing: highlight notable features, upgrade notes, links to docs, next release date, etc. -->

  Learn how to deploy KEDA by reading [our documentation](https://keda.sh/docs/$RESOLVED_VERSION_MAJOR.$RESOLVED_VERSION_MINOR/deploy/).

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  - title: "Breaking Changes"
    exclusive: true
    when:
      label: "kind/breaking-change"
  - title: "New"
    exclusive: true
    when:
      labels:
        - "kind/feature"
        - "kind/new-scaler"
  - title: "Improvements"
    exclusive: true
    when:
      labels:
        - "kind/improvement"
        - "kind/enhancement"
  - title: "Fixes"
    exclusive: true
    when:
      label: "kind/bug"
  - title: "Deprecations"
    exclusive: true
    when:
      label: "kind/deprecation"
  - title: "Other"
    exclusive: true
    when:
      labels:
        - "kind/chore"
        - "kind/documentation"
        - "kind/dependencies"
        - "kind/ci"